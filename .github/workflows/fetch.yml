name: Fetch Keterbukaan Informasi IDX

on:
  schedule:
    # Tiap 2 jam. Waktu UTC. (cron GitHub kadang telat beberapa menit -- normal.)
    - cron: "0 */2 * * *"
  workflow_dispatch: {}   # tombol "Run workflow" manual untuk tes

# Izin agar workflow bisa commit hasil balik ke repo.
permissions:
  contents: write

concurrency:
  group: fetch-idx
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps + browser
        run: |
          python -m pip install --upgrade pip
          pip install -r fetcher/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run scraper
        run: python fetcher/scrape.py

      - name: Upload artefak debug (selalu)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: |
            docs/_debug_urls.json
            docs/_debug_page.html
            docs/_raw_last_response.png
            docs/_raw_last_response.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit hasil
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/announcements.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan data."
          else
            git commit -m "data: update keterbukaan informasi $(date -u +'%Y-%m-%dT%H:%MZ')"
            git push
          fi
